# Default values — override per env (values-local.yaml / values-eks.yaml)
fullname: acid-postgres-cluster
teamId: acid

numberOfInstances: 5

postgresql:
  version: "16"

volume:
  size: 10Gi
  # Set per environment (required for reliable scheduling)
  storageClass: ""

users:
  events_platform: []

databases:
  events_platform: events_platform

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Extra labels on the CR
labels: {}
