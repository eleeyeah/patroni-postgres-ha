apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: patroni-postgres-ha
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Patroni / Zalando Postgres HA (local + EKS)
  sourceRepos:
    # REPLACE: your git remote (see ../REPO.md)
    - git@github.com:YOUR_ORG/YOUR_REPO.git
    # Zalando official Helm repo for the operator chart
    - https://opensource.zalando.com/postgres-operator/charts/postgres-operator
  destinations:
    - namespace: postgres-operator
      server: https://kubernetes.default.svc
    - namespace: postgres-ha
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
