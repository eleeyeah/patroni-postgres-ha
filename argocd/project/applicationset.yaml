apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: patroni-postgres-ha
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          # Start with local kubeadm; enable eks when lessons/200 cluster exists
          - env: local
          # - env: eks
  template:
    metadata:
      name: "patroni-pg-{{.env}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io/background
    spec:
      project: patroni-postgres-ha
      source:
        repoURL: git@github.com:eleeyeah/patroni-postgres-ha.git
        targetRevision: HEAD
        path: envs/{{.env}}
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - Validate=true
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
