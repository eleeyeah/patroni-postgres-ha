apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: patroni-postgres-ha-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    # REPLACE: see argocd/REPO.md
    repoURL: git@github.com:YOUR_ORG/YOUR_REPO.git
    targetRevision: HEAD
    path: patroni-postgres-ha/argocd/project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
