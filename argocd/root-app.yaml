apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: patroni-postgres-ha-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    repoURL: git@github.com:eleeyeah/patroni-postgres-ha.git
    targetRevision: HEAD
    path: argocd/project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
